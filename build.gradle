plugins {
    id 'com.github.ben-manes.versions' version '0.52.0'
    id 'groovy'
    id 'maven-publish'
    id 'codenarc'
    id 'java-gradle-plugin'
}

// TrailLens fork: removed `signing`, `com.gradle.plugin-publish`, and `com.vanniktech.maven.publish`.
// The fork publishes only to GitHub Packages (configured at the bottom of this file); it does not
// publish to the Gradle Plugin Portal or Maven Central. Disable any leftover Sign tasks defensively.
tasks.withType(org.gradle.plugins.signing.Sign).configureEach { task ->
    task.onlyIf { false }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext.pitestAggregatorVersion = "1.19.5"   //Must be equal to default PIT version in PitestPlugin

repositories {
    mavenCentral()
    mavenLocal()
    google()
}

sourceSets {
    funcTest
}

configurations {
    funcTest.extendsFrom(testImplementation, testRuntimeOnly, implementation)
}

dependencies {
    implementation localGroovy()
    compileOnly "org.pitest:pitest-aggregator:$pitestAggregatorVersion"
    implementation 'com.android.tools.build:gradle:9.1.0'
    implementation 'com.vdurmont:semver4j:3.1.0'

    testImplementation('org.spockframework:spock-core:2.4-M6-groovy-3.0') {
        exclude group: 'org.codehaus.groovy'
    }
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation 'net.bytebuddy:byte-buddy:1.17.5' //for Spying in Spock

    funcTestImplementation sourceSets.main.output  //to make production plugin classes visible in functional tests (it's not in testCompile configuration)
    funcTestImplementation sourceSets.test.output
    funcTestImplementation 'com.vdurmont:semver4j:3.1.0'
    funcTestImplementation 'com.android.tools.build:gradle:9.1.0'
    funcTestImplementation('com.netflix.nebula:nebula-test:10.6.2') {
        exclude group: 'org.codehaus.groovy', module: 'groovy-all'
    }
}

tasks.register('funcTest', Test) {
    description = 'Run the functional tests.'
    group = 'Verification'
    testClassesDirs = sourceSets.funcTest.output.classesDirs
    classpath = sourceSets.funcTest.runtimeClasspath
    forkEvery 1
    systemProperty('org.gradle.daemon', 'false')
    systemProperty('ignoreDeprecations', 'true') //FIXME remove after AGP stops using deprecated API
}

funcTest.shouldRunAfter test
check.shouldRunAfter funcTest
check.dependsOn funcTestClasses     //or more generically: tasks.withType(AbstractCompile)
// publishPlugins comes from com.gradle.plugin-publish — disabled for the fork.
// Plugin Portal publishing is not used; TrailLens fork ships only to GitHub Packages.

tasks.register('testReport', TestReport) {
    destinationDir = file("$buildDir/reports/allTests")
    reportOn test, funcTest
}

tasks.withType(Test).configureEach { testTask ->
    testTask.configure {
        useJUnitPlatform()

        testLogging {
            exceptionFormat = 'full'
        }

        afterSuite { desc, result ->
            if (!desc.parent) {
                if (result.testCount == 0) {
                    throw new IllegalStateException("No tests were found. Failing the build")
                }
            }
        }
    }
}

codenarc {
    toolVersion = "3.5.0"
}

tasks.register("codenarc") {
    configure {
        dependsOn tasks.withType(CodeNarc)
    }
}

//Workaround on https://github.com/gradle/gradle/issues/12663
tasks.withType(CodeNarc) { codeNarcTask ->
    codeNarcTask.finalizedBy(project.task("print${codeNarcTask.name.capitalize()}") {
        onlyIf {
            codeNarcTask.state.failure != null
        }
        doLast {
            logger.warn("\n****************************** CODE NARC ******************************")
            logger.warn(codeNarcTask.reports.text.outputLocation.getAsFile().get().text.trim())
            logger.warn("****************************** CODE NARC ******************************\n")
        }
    })
}

gradlePlugin {
    website = POM_URL
    vcsUrl = POM_URL
    testSourceSets sourceSets.funcTest
    plugins {
        pitest {
            id = 'pl.droidsonroids.pitest'
            implementationClass = 'pl.droidsonroids.gradle.pitest.PitestPlugin'
            tags.addAll('pitest', 'android', 'mutation testing')
            displayName = POM_NAME
            description = POM_DESCRIPTION
            version = VERSION_NAME
            group = GROUP
        }
        pitestAggregator {
            id = 'pl.droidsonroids.pitest.aggregator'
            tags.addAll('pitest', 'android', 'mutation testing')
            implementationClass = 'pl.droidsonroids.gradle.pitest.PitestAggregatorPlugin'
            displayName = 'Android Gradle pitest aggregator plugin'
            description = POM_DESCRIPTION
        }
    }
}

// TrailLens GitHub Packages publishing target (AGP-9-only fork).
// Credentials are sourced from gradle properties (githubPackagesUser/githubPackagesToken)
// or env vars (GITHUB_ACTOR/GITHUB_TOKEN for same-repo CI; PAT with read:packages for cross-repo).
publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/TrailLensCo/gradle-pitest-plugin")
            credentials {
                username = providers.gradleProperty("githubPackagesUser").getOrNull() ?: System.getenv("GITHUB_ACTOR")
                password = providers.gradleProperty("githubPackagesToken").getOrNull() ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
